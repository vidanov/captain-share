[metadata]
name = captain-share
version = attr: captain_share.__version__
description = Local sharing manager for skills, agents, prompts and steering
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE

[options]
packages = find:
python_requires = >=3.9
include_package_data = False

[options.packages.find]
include = captain_share*

[options.package_data]
captain_share = web/*, web/tour/*, skills/*/SKILL.md

[options.entry_points]
console_scripts =
    captain-share = captain_share.cli:main
